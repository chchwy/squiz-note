# SITE CONFIGURATION
baseurl: "/squiz-note"
url: "https://chchwy.github.io"
permalink: "/:categories/:year/:month/:day/"

# THEME CONFIGURATION
title: Squiz Today 學習筆記
description: "每日 Squiz Today 英文學習筆記（News Highlights、進階單字、Aussie slang、逐字稿）"
lang: zh-TW
timezone: Asia/Taipei

theme: type-on-strap

# Header and Footer
header_text: Squiz Today 學習筆記
footer_text: >
  Squiz Today 英文學習筆記

color_theme: auto  # auto, dark, or light

excerpt: false

paginate: 10
paginate_path: "/page:num"

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed

# Navigation Bar
navigation:
  - name: 首頁
    link: /
  - name: 標籤
    link: /tags
  - name: 關於
    link: /about

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
